<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shouryan Nikam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute(
            "data-theme",
            saved || (prefersDark ? "dark" : "light")
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a href="/" data-link class="brand">Shouryan Nikam</a>

        <nav class="nav-group" aria-label="Primary">
          <a href="/projects" data-link class="nav-link" data-nav="projects">Projects</a>
          <a href="/writing" data-link class="nav-link" data-nav="writing">Writing</a>
          <a href="/about" data-link class="nav-link" data-nav="about">About</a>
        </nav>
      </header>

      <main id="app"></main>

      <footer class="footer">
        <div class="footer-links">
          <button id="copy-email" type="button" class="inline-link">Email</button>
          <a href="https://github.com" target="_blank" rel="noreferrer" class="inline-link">GitHub</a>
          <a href="https://linkedin.com" target="_blank" rel="noreferrer" class="inline-link">LinkedIn</a>

          <span class="tooltip-wrap tooltip-wrap--top">
            <button
              id="theme-btn"
              class="icon-btn"
              aria-label="Toggle light and dark theme"
            ></button>
            <span class="tooltip" role="tooltip">Theme <kbd>T</kbd></span>
          </span>
        </div>
      </footer>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
